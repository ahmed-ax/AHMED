<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصمم جرافيك احترافي | بورتفوليو</title>
  <meta name="description" content="مصمم جرافيك متخصص في بناء الشعارات، الهويات البصرية، وتصاميم السوشيال ميديا الاحترافية." />

  <!-- ===================================================
       خط Google Fonts - Cairo
       يمكن تغيير الخط إلى Tajawal بتعديل الرابط أدناه
       =================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ===================================================
       مكتبة Tailwind CSS عبر CDN
       =================================================== -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ===================================================
       مكتبة Font Awesome للأيقونات
       =================================================== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- ===================================================
       مكتبة AOS (Animate On Scroll) للتحريكات
       =================================================== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

  <!-- ===================================================
       إعداد Tailwind Config - اللون الرئيسي الزيتي
       =================================================== -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            olive: {
              DEFAULT: '#16625a',
              light:   '#1d7d73',
              dark:    '#0f4540',
              pale:    '#e8f4f3',
              muted:   '#c2dedd',
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          keyframes: {
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            'pulse-glow': {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(22, 98, 90, 0.7)' },
              '50%': { boxShadow: '0 0 0 10px rgba(22, 98, 90, 0)' },
            },
            'spin-slow': {
              'from': { transform: 'rotate(0deg)' },
              'to': { transform: 'rotate(360deg)' },
            },
            'shimmer': {
              '0%': { backgroundPosition: '-1000px 0' },
              '100%': { backgroundPosition: '1000px 0' },
            },
            'bounce-slow': {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            'sway': {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '25%': { transform: 'translateX(10px) rotate(2deg)' },
              '75%': { transform: 'translateX(-10px) rotate(-2deg)' },
            },
            'rotate-slow': {
              'from': { transform: 'rotate(0deg)' },
              'to': { transform: 'rotate(360deg)' },
            },
            'wave': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '25%': { transform: 'translateY(-10px)' },
              '50%': { transform: 'translateY(0px)' },
              '75%': { transform: 'translateY(10px)' },
            },
            'glow': {
              '0%, 100%': { boxShadow: '0 0 5px rgba(22, 98, 90, 0.3)' },
              '50%': { boxShadow: '0 0 20px rgba(22, 98, 90, 0.6)' },
            },
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'pulse-glow': 'pulse-glow 2s infinite',
            'spin-slow': 'spin-slow 20s linear infinite',
            'shimmer': 'shimmer 8s ease-in-out infinite',
            'bounce-slow': 'bounce-slow 2s ease-in-out infinite',
            'sway': 'sway 4s ease-in-out infinite',
            'rotate-slow': 'rotate-slow 15s linear infinite',
            'wave': 'wave 3s ease-in-out infinite',
            'glow': 'glow 2s ease-in-out infinite',
          }
        }
      }
    }
  </script>

  <style>
    /* ===================================================
       تحريكات CSS مخصصة وتأثيرات عامة
       ================================================== */
    
    * {
      transition: all 0.3s ease;
    }

    body {
      background: linear-gradient(135deg, #ffffff 0%, #f5fffe 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية متحركة بعناصر هندسية */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(22, 98, 90, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(22, 98, 90, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
      animation: shimmer 8s ease-in-out infinite;
    }

    /* تأثيرات الأزرار والروابط */
    button, a {
      position: relative;
      overflow: hidden;
    }

    button::before, a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(22, 98, 90, 0.1);
      transition: left 0.3s ease;
      z-index: -1;
    }

    button:hover::before, a:hover::before {
      left: 100%;
    }

    /* تأثير الظهور على التمرير */
    .reveal {
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* تحريك البطاقات */
    .portfolio-card {
      animation: slideIn 0.6s ease-out forwards;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .portfolio-card {
      animation: sway 4s ease-in-out infinite !important;
    }

    .portfolio-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 40px rgba(22, 98, 90, 0.15);
      animation: none !important;
    }

    /* تحريك الصور في البطاقات */
    .card-img {
      animation: zoomIn 0.8s ease-out forwards, wave 3s ease-in-out infinite 0.8s;
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* تحريك الأيقونات */
    .whatsapp-pulse {
      animation: pulse-glow 2s infinite, sway 4s ease-in-out infinite;
    }

    i {
      animation: rotate-slow 20s linear infinite;
    }

    .fa-whatsapp, .fa-x-twitter, .fa-envelope {
      animation: glow 2s ease-in-out infinite, rotate-slow 15s linear infinite;
    }

    /* تحريك النصوص */
    h1, h2, h3 {
      animation: slideInDown 0.8s ease-out;
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* تحريك أشرطة المهارات */
    .skill-bar {
      animation: fillBar 1.5s ease-out forwards;
    }

    @keyframes fillBar {
      from {
        width: 0;
        opacity: 0;
      }
      to {
        width: 100%;
        opacity: 1;
      }
    }

    /* تحريك الشارات والعلامات */
    .badge, span[style*="background:#e8f4f3"] {
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* تحريك الصور الشخصية */
    .rounded-full {
      animation: float 4s ease-in-out infinite;
    }

    /* تحريك أزرار التنقل في المودال */
    #prev-img, #next-img {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    #prev-img:hover, #next-img:hover {
      transform: scale(1.15) rotate(5deg);
      background-color: #16625a !important;
      color: white !important;
    }

    /* تحريك العناصر عند التمرير */
    .aos-animate {
      animation: fadeInUp 0.8s ease-out;
    }

    /* تأثير الماوس على الأزرار */
    .btn-primary, .btn-outline, .contact-btn {
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover, .btn-outline:hover, .contact-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(22, 98, 90, 0.2);
    }

    /* تحريك الفوتر */
    footer {
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* تحريك العناصر في الهيدر */
    .navbar {
      animation: slideDown 0.8s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===================================================
       الأنماط العامة والمتغيرات
       =================================================== */
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f9fafb;
      color: #1a1a2e;
      overflow-x: hidden;
    }

    /* ===================================================
       شريط التمرير المخصص
       =================================================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #16625a; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #0f4540; }

    /* ===================================================
       الهيدر - تأثير Glassmorphism
       =================================================== */
    #navbar {
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      background-color: rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(22, 98, 90, 0.12);
      transition: all 0.35s ease;
    }

    #navbar.scrolled {
      background-color: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 30px rgba(22, 98, 90, 0.1);
    }

    /* رابط التنقل - تأثير الخط السفلي */
    .nav-link {
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: 0;
      width: 0;
      height: 2px;
      background: #16625a;
      border-radius: 2px;
      transition: width 0.35s ease;
    }
    .nav-link:hover::after,
    .nav-link.active::after { width: 100%; }
    .nav-link:hover { color: #16625a; }

    /* ===================================================
       قسم Hero - الخلفية والنص
       =================================================== */
    #hero {
      background: linear-gradient(135deg, #f0faf9 0%, #e8f4f3 40%, #f9fafb 100%);
      position: relative;
      overflow: hidden;
    }

    /* دوائر زخرفية في الخلفية */
    #hero::before {
      content: '';
      position: absolute;
      top: -120px;
      left: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(22,98,90,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    #hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(22,98,90,0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* تأثير الكتابة المتحركة */
    .typed-cursor {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: #16625a;
      margin-right: 4px;
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ===================================================
       بطاقات الأعمال - Portfolio Cards
       =================================================== */
    .portfolio-card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1),
                  box-shadow 0.4s ease;
      background: #fff;
      box-shadow: 0 2px 15px rgba(0,0,0,0.07);
    }
    .portfolio-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 50px rgba(22, 98, 90, 0.18);
    }

    /* طبقة التغطية عند Hover */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(22,98,90,0.92) 0%, rgba(22,98,90,0.4) 60%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
    }
    .portfolio-card:hover .card-overlay { opacity: 1; }

    .card-overlay-content {
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }
    .portfolio-card:hover .card-overlay-content { transform: translateY(0); }

    /* صورة البطاقة */
    .card-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .portfolio-card:hover .card-img { transform: scale(1.06); }

    /* ===================================================
       Modal - النافذة المنبثقة
       =================================================== */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 28, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    #modal-box {
      background: #fff;
      border-radius: 20px;
      max-width: 780px;
      width: 100%;

      overflow-y: auto;
      transform: scale(0.88) translateY(30px);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      opacity: 0;
      box-shadow: 0 30px 80px rgba(0,0,0,0.25);
    }
    #modal-overlay.active #modal-box {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* ===================================================
       أزرار CTA
       =================================================== */
    .btn-primary {
      background: #16625a;
